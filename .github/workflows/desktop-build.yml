name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-windows'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Prepare Binaries and Resources
        shell: bash
        run: |
          mkdir -p composeApp/src/desktopMain/resources/bin

          # دانلود باینری رسمی سایفون اگر از قبل نباشد
          if [ ! -f "composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe" ]; then
            echo "Downloading Psiphon tunnel core..."
            curl -L -f -o composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/windows/psiphon-tunnel-core-i686.exe
          fi

          # کپی فایل سرورها از پوشه اندروید به منابع دسکتاپ
          if [ -f "app/src/main/assets/server_entries.txt" ]; then
            cp app/src/main/assets/server_entries.txt composeApp/src/desktopMain/resources/server_entries.txt
            cp app/src/main/assets/server_entries.txt composeApp/src/desktopMain/resources/bin/server_entries.txt
          fi

          echo "=== Check bin folder ==="
          ls -la composeApp/src/desktopMain/resources/bin

      - name: Build EXE and MSI
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-EXE
          path: composeApp/build/compose/binaries/main-release/exe/*.exe

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-MSI
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
