name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-windows'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Prepare and Download Cores (Aether v2.3.0 & Psiphon)
        shell: bash
        run: |
          mkdir -p composeApp/src/desktopMain/resources/bin

          # حذف فایل‌های قدیمی یا اشتباهی
          rm -f composeApp/src/desktopMain/resources/bin/aether.exe
          rm -f composeApp/src/desktopMain/resources/bin/server_entries.txt

          echo "Downloading Psiphon tunnel core..."
          curl -L -f -o composeApp/src/desktopMain/resources/bin/psiphon-tunnel-core.exe https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/windows/psiphon-tunnel-core-i686.exe

          echo "Downloading latest official Aether Core (v2.3.0)..."
          curl -L -f -o aether.zip https://github.com/CluvexStudio/Aether/releases/latest/download/aether-windows-x86_64.zip
          unzip -o aether.zip -d composeApp/src/desktopMain/resources/bin/
          rm -f aether.zip

          # اطمینان از وجود سرور انتری‌ها از بخش اندروید
          if [ -f "app/src/main/assets/server_entries.txt" ]; then
            cp app/src/main/assets/server_entries.txt composeApp/src/desktopMain/resources/server_entries.txt
          fi

          echo "=== Files in bin directory ==="
          ls -la composeApp/src/desktopMain/resources/bin

      - name: Build EXE and MSI
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-EXE
          path: composeApp/build/compose/binaries/main-release/exe/*.exe

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-MSI
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: Create Release (Optional - only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main-release/exe/*.exe
            composeApp/build/compose/binaries/main-release/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
