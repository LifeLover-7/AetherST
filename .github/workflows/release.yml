name: Build & Release Multi-APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-android'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/src/main
          echo $ENCODED_STRING | base64 --decode > app/src/main/release.jks

      - name: Build Multi-APK with Gradle
        env:
          KEYSTORE_FILE: src/main/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Organize & Find APKs
        id: rename_apks
        run: |
          RELEASE_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$RELEASE_DIR"
          
          # جستجوی خودکار برای تمام فایل‌های APK تولید شده در هر پوشه‌ای
          find . -type f -name "*.apk" -exec cp -v {} "$RELEASE_DIR/" \;
          
          # بررسی وجود فایل
          ls -la "$RELEASE_DIR"
          if [ -z "$(ls -A "$RELEASE_DIR")" ]; then
            echo "Error: No APK files found in workspace!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Custom-Debug-APK
          path: release-artifacts/*.apk
          retention-days: 7

      - name: Cleanup Sensitive Data
        if: always()
        run: rm -f app/src/main/release.jks
